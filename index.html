<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Konsep PLSV: Ringkasan Interaktif Kelas VIII</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f8fbff;--grid:#d9e8f6;--ink:#1b2a4e;--mut:#55658a;--red:#e5484d;--hl:#ffe36e;--hl2:#fff4b8;--grn:#1f8a5f;--grn-l:#dff5ea;--blu:#2f6fed;--blu-l:#e4edff;--bad:#c93a3f;--bad-l:#ffe3e3;--card:#fff;--line:#c4d6ea;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0f1a2e;--grid:#1a2a47;--ink:#e8eefc;--mut:#9fb0d4;--red:#ff7075;--hl:#6b5b00;--hl2:#4a4000;--grn:#52d29c;--grn-l:#12372a;--blu:#7fa6ff;--blu-l:#1a2a52;--bad:#ff8a8e;--bad-l:#43181b;--card:#16243d;--line:#2c4166;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0f1a2e;--grid:#1a2a47;--ink:#e8eefc;--mut:#9fb0d4;--red:#ff7075;--hl:#6b5b00;--hl2:#4a4000;--grn:#52d29c;--grn-l:#12372a;--bad:#ff8a8e;--bad-l:#43181b;--blu:#7fa6ff;--blu-l:#1a2a52;--card:#16243d;--line:#2c4166;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font:400 16px/1.65 'Lexend',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:30}
body::after{content:"";position:fixed;top:0;bottom:0;left:30px;width:2px;background:var(--red);opacity:.45;pointer-events:none}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 48px 50px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:2px solid var(--ink);margin:0 -18px 0 -50px;padding:0 18px 0 50px}
.nav-in{max-width:760px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.nav-in::-webkit-scrollbar{display:none}
nav button{flex:none;font:600 13px/1 'Lexend',system-ui,sans-serif;color:var(--ink);background:transparent;border:2px solid transparent;border-radius:999px;padding:8px 12px;cursor:pointer}
nav button.on{background:var(--hl);border-color:var(--ink)}
#bar{height:4px;width:0;background:var(--red)}
button:focus-visible,input:focus-visible{outline:3px solid var(--blu);outline-offset:2px}
.hero{padding:44px 0 20px}
.hero h1{font-size:clamp(30px,7vw,46px);line-height:1.12;margin:0 0 12px;letter-spacing:-.02em}
.hero p{margin:0 0 18px;color:var(--mut);max-width:52ch}
.who{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.who span{font-size:13px;background:var(--card);border:2px solid var(--ink);border-radius:8px 8px 8px 2px;padding:4px 10px}
.sheet{background:var(--card);border:2px solid var(--ink);border-radius:16px 16px 16px 4px;box-shadow:5px 5px 0 var(--ink);padding:18px}
.big{font:700 clamp(32px,9vw,52px)/1.2 'Lexend',sans-serif;letter-spacing:.02em;margin:4px 0 12px}
.big i,.eq i{font-family:Georgia,'Times New Roman',serif;font-weight:400}
.hand{font:600 22px/1.2 'Caveat','Segoe Print',cursive;color:var(--red)}
